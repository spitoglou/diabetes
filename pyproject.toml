[project]
name = "diabetes"
version = "0.5.0"
description = "Add your description here"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ipykernel>=6.25.1",
    "ipython>=7.34.0",
    "loguru>=0.7.0",
    "lxml>=4.9.3",
    "neptune>=1.6.0",
    "openpyxl>=3.1.2",
    "pycaret>=3.0.4",
    "pymongo>=4.4.1",
    "tsfresh>=0.20.1",
    "typer>=0.9.0",
    "streamsync>=0.2.8",
    "requests>=2.32.5",
    "commitizen>=4.11.0",
    "pydantic-settings>=2.12.0",
    "simglucose>=0.2.11",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=7.4.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
